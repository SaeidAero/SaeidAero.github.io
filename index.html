
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>GOLDEN JOURNEY</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#home">GOLDEN<span> JOURNEY</span></a>
    <a class="top-link" href="#story">کشف داستان <span>↗</span></a>
  </header>

  <main id="home">

    <!-- قاب سینمایی؛ عکس‌ها در همین قاب حرکت می‌کنند -->
    <section class="cinema" id="story" aria-label="سکانس سینمایی">

      <div class="cinema-frame">
        <div class="image-layer image-0"></div>
        <div class="image-layer image-1"></div>
        <div class="image-layer image-2"></div>
        <div class="image-layer image-3"></div>
        <div class="image-layer image-4"></div>

        <div class="cinema-shade"></div>
        <div class="film-grain"></div>

        <div class="cinema-content">
          <p class="eyebrow" id="scene-number">CHAPTER 01 / 05</p>

          <h1 id="scene-title">فراتر از لحظه</h1>

          <p class="scene-description" id="scene-description">
            هر مسیر، داستانی برای کشف کردن دارد.
          </p>

          <div class="scroll-hint">
            <span class="scroll-line"></span>
            <span>برای ادامه، اسکرول کن</span>
          </div>
        </div>

        <div class="progress-area">
          <span class="progress-label">THE JOURNEY</span>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <span class="progress-count" id="progress-count">01 — 05</span>
        </div>

        <span class="corner-mark mark-left">GJ.</span>
        <span class="corner-mark mark-right">EST. IN MOTION</span>
      </div>

    </section>

    <section class="closing">
      <p class="eyebrow">THE END IS A BEGINNING</p>
      <h2>داستان <span>ادامه دارد.</span></h2>
      <p>هر قدم، نمایی تازه از مسیر است.</p>
      <a class="back-link" href="#home">بازگشت به ابتدا ↑</a>
    </section>

  </main>

  <footer>
    <span>GOLDEN JOURNEY</span>
    <span>DESIGNED TO MOVE</span>
  </footer>

</body>
</html>
